name: Daily signal report

on:
  schedule:
    # 21:33 UTC = 05:33 Malaysia time (early start leaves a buffer for GitHub's
    # scheduler delays). The "Wait until 00:05 UTC" step below then holds the job
    # until after 00:00 UTC, because signals.py only counts bars dated before
    # today (UTC) as complete.
    - cron: "33 21 * * *"
  workflow_dispatch:   # lets you press "Run workflow" manually

permissions:
  contents: write      # lets the job save the report back into the repo

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install yfinance pandas numpy

      - name: Wait until 00:05 UTC
        if: github.event_name == 'schedule'   # manual runs start immediately
        run: |
          now=$(date -u +%s)
          target=$(date -u -d "today 00:05" +%s)
          # Triggered before midnight UTC -> wait for the next 00:05 UTC.
          # Triggered after (late by the scheduler) -> run immediately.
          if [ "$(date -u +%H)" -ge 12 ]; then target=$(date -u -d "tomorrow 00:05" +%s); fi
          wait=$((target - now))
          if [ "$wait" -gt 0 ]; then echo "Sleeping ${wait}s"; sleep "$wait"; fi

      - name: Run scanner
        env:
          TZ: Asia/Kuala_Lumpur
        run: python signals.py

      - name: Publish latest report
        env:
          TZ: Asia/Kuala_Lumpur
        run: |
          cp "$(ls -t signal_reports/*.txt | head -1)" latest.txt
          cp "$(ls -t signal_reports/*.csv | head -1)" latest.csv
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add latest.txt latest.csv signal_reports
          git commit -m "Signal report $(date +%F)" || echo "No changes to commit"
          git push
