name: Daily signal report

# This workflow has no schedule of its own: GitHub's scheduler can start jobs
# hours late. A scheduled Claude task starts it at 08:30 Malaysia time through
# the GitHub API (workflow_dispatch), and you can also press "Run workflow" by
# hand in the Actions tab. Start it after 00:00 UTC (08:00 Malaysia time),
# because signals.py only counts bars dated before today (UTC) as complete.
on:
  workflow_dispatch:

permissions:
  contents: write      # lets the job save the report back into the repo

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install yfinance pandas numpy

      - name: Run scanner
        env:
          TZ: Asia/Kuala_Lumpur
        run: python signals.py

      - name: Publish latest report
        env:
          TZ: Asia/Kuala_Lumpur
        run: |
          cp "$(ls -t signal_reports/*.txt | head -1)" latest.txt
          cp "$(ls -t signal_reports/*.csv | head -1)" latest.csv
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add latest.txt latest.csv signal_reports
          git commit -m "Signal report $(date +%F)" || echo "No changes to commit"
          git push
